<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1">
  <title>考勤日历 · 人脸签到</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5f1;
      --ink: #25272b;
      --muted: #62635e;
      --rule: #c9c9c1;
      --berry: #812843;
      --wash: #f3e6e8;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink); background: var(--paper);
    }
    * { box-sizing: border-box }
    body { margin: 0 }
    button, input { font: inherit }
    button { cursor: pointer; color: inherit }
    button:focus-visible, input:focus-visible { outline: 3px solid #8c5073; outline-offset: 3px }
    [hidden] { display: none !important }
    svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.65;
          stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0 }
    .symbols { width: 0; height: 0; position: absolute; overflow: hidden }
    .shell { max-width: 1140px; margin: auto; padding: 0 60px }
    .mast { height: 88px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--ink) }
    .brand, .zone { display: inline-flex; align-items: center; gap: 10px }
    .brand { font-weight: 700; font-size: 17px }
    .brand svg { color: var(--berry); width: 25px; height: 25px }
    .zone { color: var(--muted); font-size: 13px; gap: 6px }
    .zone svg { width: 16px; height: 16px }
    main { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(270px, .82fr);
           gap: clamp(36px, 7vw, 104px); align-items: center; margin: clamp(52px, 10vh, 112px) 0 60px }
    .calendar { position: relative; background: #fffefa; border: 1px solid #bcbdb4;
                box-shadow: 0 3px 0 -1px #fffefa, 0 4px 0 -1px #bcbdb4, 0 7px 0 -2px #fffefa, 0 8px 0 -2px #bcbdb4 }
    .calendar-head { display: flex; align-items: baseline; justify-content: space-between;
                     margin: 0 28px; padding: 21px 0 16px; border-bottom: 1px solid var(--rule) }
    .calendar-head strong { font-weight: 650; font-size: 17px; letter-spacing: .045em }
    .weekday { font-size: 14px; color: var(--berry) }
    .day { display: grid; place-items: center; min-height: 292px; padding: 13px 0 24px; font: 250px/.86 "Times New Roman", Times, serif;
           color: var(--berry); font-variant-numeric: lining-nums; letter-spacing: -.055em; text-indent: -.03em }
    .week { border-top: 1px dashed var(--rule); display: grid; grid-template-columns: repeat(7, 1fr);
            list-style: none; margin: 0; padding: 17px 14px 18px; text-align: center }
    .week li { display: grid; justify-items: center; gap: 4px }
    .week span { font-size: 12px; color: var(--muted) }
    .week strong { display: grid; place-items: center; height: 30px; min-width: 30px; border-radius: 50%;
                   font: 17px/1 Georgia, serif; font-variant-numeric: tabular-nums }
    .week [aria-current="date"] strong { background: var(--berry); color: white }
    h1, h2, p { margin: 0 }
    h1, h2 { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; font-weight: 700 }
    h1 { font-size: clamp(44px, 4.1vw, 60px); letter-spacing: -.04em; line-height: 1.2 }
    h1 + .primary { margin-top: 24px }
    .primary, .alternate { display: flex; justify-content: center; align-items: center; gap: 12px;
                           min-height: 52px; width: 100%; padding: 12px 16px; border-radius: 4px; font-weight: 600 }
    .primary { color: white; background: var(--berry); border: 1px solid var(--berry) }
    .primary:hover { background: #6a1f36 }
    .links { margin-top: 32px; border-top: 1px solid var(--rule) }
    .route { border: 0; border-bottom: 1px solid var(--rule); background: transparent;
             width: 100%; display: grid; grid-template-columns: 24px 1fr 16px; gap: 13px;
             text-align: start; align-items: center; padding: 15px 0 }
    .route:hover { background: #efeee8 }
    .route .arrow { width: 15px; height: 15px }
    .route small { display: block; font-size: 14px; color: var(--muted); margin-top: 1px }
    .route b { font-size: 16px; font-weight: 650 }
    dialog { color: var(--ink); margin: auto; width: min(460px,calc(100% - 26px)); max-height: 92dvh; overflow-y: auto;
             border: 1px solid var(--rule); background: #fffefa; padding: 24px; border-radius: 6px }
    dialog::backdrop { background: #19191d69 }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--rule); padding-bottom: 12px; margin-bottom: 16px }
    h2 { font-size: 27px }
    .close { width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center }
    .hint { color: var(--muted); margin-bottom: 16px }
    .fields { display: grid; gap: 13px; margin-bottom: 16px }
    .fields label { display: grid; gap: 4px; font-weight: 600 }
    .fields input { border: 1px solid #a5a69f; border-radius: 4px; padding: 9px 12px; width: 100%; background: white; color: var(--ink) }
    .photo-tools { display: flex; gap: 8px; margin: 8px 0 12px }
    .alternate { background: transparent; border: 1px solid var(--rule); font-weight: 500; min-height: 44px; padding: 8px }
    .preview { display: block; margin: 0 auto 16px; max-height: 160px; max-width: 100%; object-fit: contain }
    .message:not(:empty) { margin-top: 12px; padding: 10px; color: #632037; background: var(--wash) }
    @media (max-width: 750px) {
      .shell { max-width: 500px; padding: 0 22px }
      .mast { height: 62px }
      main { display: flex; flex-direction: column; align-items: stretch; gap: 31px; margin: 23px 0 34px }
      .calendar-head { margin: 0 20px; padding: 12px 0 9px }
      .calendar-head strong { font-size: 16px }
      .day { min-height: 145px; font-size: 146px; padding: 2px 0 13px }
      .week { padding: 9px 8px 10px }
      .week li { gap: 2px }
      .week strong { height: 26px; min-width: 26px; font-size: 16px }
      h1 { font-size: 37px }
      h1 + .primary { margin-top: 15px }
      .links { margin-top: 19px }
      .route { padding: 10px 0 }
    }
  </style>
</head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 5 3 3 5-5"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="camera" viewBox="0 0 24 24"><path d="M3 8h4l1.8-3h6.4L17 8h4v12H3z"/><circle cx="12" cy="13.5" r="3.3"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.3"/><path d="M3 20c0-4.5 3-6.7 7-6.7 1.5 0 2.8.3 4 1M18 13v7m-3.5-3.5h7"/></symbol>
  <symbol id="log" viewBox="0 0 24 24"><path d="M12 4h7v16h-7M3 12h12m-4-4 4 4-4 4"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="cross" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</svg>
<div class="shell">
  <header class="mast">
    <span class="brand"><svg aria-hidden="true"><use href="#calendar"/></svg>人脸签到</span>
    <span class="zone"><svg aria-hidden="true"><use href="#clock"/></svg>北京时间</span>
  </header>
  <main>
    <section class="calendar" aria-label="本周日历">
      <div class="calendar-head"><strong id="month"></strong><span id="weekday" class="weekday"></span></div>
      <time id="day" class="day"></time>
      <ol id="week" class="week" aria-label="本周日期"></ol>
    </section>
    <section>
      <h1>今日打卡</h1>
      <button class="primary" id="check"><svg aria-hidden="true"><use href="#camera"/></svg>拍照打卡</button>
      <div class="links">
        <button class="route" id="register"><svg aria-hidden="true"><use href="#user"/></svg><span><b>注册账号</b><small>首次使用，录入本人标准照</small></span><svg class="arrow" aria-hidden="true"><use href="#arrow"/></svg></button>
        <button class="route" id="login"><svg aria-hidden="true"><use href="#log"/></svg><span><b>学号登录</b><small>管理标准照，查看考勤记录</small></span><svg class="arrow" aria-hidden="true"><use href="#arrow"/></svg></button>
      </div>
    </section>
  </main>
</div>
<dialog id="panel" aria-labelledby="title">
  <div class="dialog-head">
    <h2 id="title"></h2>
    <button class="close" type="button" aria-label="关闭"><svg aria-hidden="true"><use href="#cross"/></svg></button>
  </div>
  <form id="details">
    <div id="fields" class="fields">
      <label>学号<input name="studentNo" type="text" inputmode="numeric" maxlength="32" pattern="[0-9]{1,32}" autocomplete="username" required></label>
      <label id="name-field">姓名<input name="name" maxlength="64" autocomplete="name" required></label>
      <label>密码<input name="password" type="password" required></label>
    </div>
    <div id="photo-area">
      <p class="hint" id="photo-help"></p>
      <div class="photo-tools">
        <button class="alternate" type="button" id="camera-button">现场拍照</button>
        <button class="alternate" type="button" id="album-button">从相册选择</button>
      </div>
      <input type="file" id="camera-file" accept="image/jpeg,image/png" capture="user" hidden>
      <input type="file" id="album-file" accept="image/jpeg,image/png" hidden>
      <img class="preview" id="preview" alt="所选照片预览" hidden>
    </div>
    <button class="primary" id="submit" type="submit"></button>
    <p aria-live="polite" class="message" id="message"></p>
  </form>
</dialog>
<script>
  const el = id => document.getElementById(id);
  const calendarFormat = new Intl.DateTimeFormat('en', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
  });
  const weekdays = [...'一二三四五六日'];
  function showDate() {
    const parts = Object.fromEntries(calendarFormat.formatToParts(new Date()).map(p => [p.type,p.value]));
    const iso = [parts.year, parts.month, parts.day].join('-');
    if (el('day').dateTime === iso) return;
    const day = new Date(iso + 'T00:00:00Z');
    const pos = (day.getUTCDay() + 6) % 7;
    el('month').textContent = parts.year + ' 年 ' + Number(parts.month) + ' 月';
    el('weekday').textContent = '星期' + weekdays[pos];
    el('day').dateTime = iso;
    el('day').textContent = parts.day;
    const monday = day.valueOf() - pos * 86400000;
    el('week').replaceChildren(...weekdays.map((name, i) => {
      const node = document.createElement('li');
      const d = new Date(monday + i * 86400000);
      const weekday = document.createElement('span');
      const number = document.createElement('strong');
      weekday.textContent = name;
      number.textContent = d.getUTCDate();
      node.setAttribute('aria-label', (d.getUTCMonth()+1) + '月' + d.getUTCDate() + '日，星期' + name);
      if (i === pos) node.setAttribute('aria-current','date');
      node.append(weekday,number);
      return node;
    }));
  }
  showDate();
  setInterval(showDate, 30000);
  document.addEventListener('visibilitychange', showDate);
  const panel = el('panel'), form = el('details'), preview = el('preview');
  let mode, photoUrl = '';
  function clearPhoto() {
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = '';
    preview.removeAttribute('src');
    preview.hidden = true;
  }
  function openPanel(next) {
    mode = next;
    clearPhoto();
    form.reset();
    const registering = mode === 'register';
    el('title').textContent = {register:'注册账号', login:'学号登录', check:'拍照打卡'}[mode];
    el('fields').hidden = mode === 'check';
    for (const field of el('fields').querySelectorAll('input')) field.disabled = mode === 'check';
    el('name-field').hidden = !registering;
    form.elements.name.disabled = !registering;
    form.elements.name.setCustomValidity('');
    form.elements.password.minLength = registering ? 8 : 1;
    if (registering) form.elements.password.maxLength = 64;
    else form.elements.password.removeAttribute('maxlength');
    form.elements.password.autocomplete = registering ? 'new-password' : 'current-password';
    el('photo-area').hidden = mode === 'login';
    el('album-button').hidden = !registering;
    el('photo-help').textContent = registering
      ? '选择清晰的本人单人标准照。支持 JPEG、PNG，最大 5 MiB。'
      : '请正对镜头，确保画面中只有本人。支持 JPEG、PNG，最大 5 MiB。';
    el('submit').textContent = {register:'提交注册',login:'登录',check:'提交打卡'}[mode];
    el('message').textContent = '';
    panel.showModal();
  }
  ['register','login'].forEach(id => el(id).onclick = () => openPanel(id));
  el('check').onclick = () => {
    openPanel('check');
    el('camera-file').click();
  };
  document.querySelector('.close').onclick = () => panel.close();
  panel.addEventListener('close', () => { clearPhoto(); form.reset(); el('message').textContent = ''; });
  form.elements.name.addEventListener('input', event => event.target.setCustomValidity(''));
  for (const source of ['camera','album']) {
    const input = el(source + '-file');
    el(source + '-button').onclick = () => input.click();
    input.onchange = () => {
      const file = input.files[0];
      if (!file) return;
      clearPhoto();
      input.value = '';
      if (!['image/jpeg','image/png'].includes(file.type) || file.size > 5242880) {
        el('message').textContent = '请选择不超过 5 MiB 的 JPEG 或 PNG 图片。';
        return;
      }
      photoUrl = URL.createObjectURL(file);
      preview.src = photoUrl;
      preview.hidden = false;
      el('message').textContent = '';
    };
  }
  preview.onerror = () => {
    clearPhoto();
    el('message').textContent = '图片无法读取，请重新选择。';
  };
  form.onsubmit = event => {
    event.preventDefault();
    if (mode === 'register' && !form.elements.name.value.trim()) {
      form.elements.name.setCustomValidity('请填写姓名');
      form.reportValidity();
      return;
    }
    el('message').textContent = mode !== 'login' && !photoUrl
      ? (mode === 'check' ? '请先拍摄现场照。' : '请先录入一张本人标准照。')
      : '当前为交互初稿，尚未向服务器提交。';
  };
</script>
</body>
</html>
