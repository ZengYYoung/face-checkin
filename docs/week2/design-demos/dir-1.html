<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>人脸签到 · 现场打卡</title>
<style>
:root {
  color-scheme: dark;
  --bg:#101c19; --surface:#172823; --line:#344b42; --text:#f4f6ed;
  --muted:#b9c9be; --accent:#ddf69e; --ink:#15251e;
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
* {box-sizing:border-box}
body {margin:0; min-height:100svh; background:var(--bg); color:var(--text)}
button,input {font:inherit}
button {cursor:pointer; color:inherit}
:focus-visible {outline:3px solid #f6c874; outline-offset:4px}
header,main {max-width:1216px; margin:auto; padding:0 48px}
.bar {display:flex; align-items:center; justify-content:space-between; height:88px; border-bottom:1px solid var(--line)}
.brand {font-size:20px; font-weight:650; display:flex; align-items:center; gap:13px; letter-spacing:.04em}
.mark {width:27px; height:27px; position:relative; color:var(--accent);
 background:linear-gradient(currentColor,currentColor) top left/10px 3px,linear-gradient(currentColor,currentColor) top left/3px 10px,linear-gradient(currentColor,currentColor) bottom right/10px 3px,linear-gradient(currentColor,currentColor) bottom right/3px 10px; background-repeat:no-repeat}
.mark:after {content:""; position:absolute; inset:9px; border:2px solid; border-radius:50%}
.login,.back {border:1px solid var(--line); background:transparent; min-height:44px; border-radius:24px; padding:0 18px; font-weight:600}
.login:hover,.back:hover {background:var(--surface)}
main {padding-top:clamp(44px,9vh,98px); padding-bottom:48px}
.station {display:grid; grid-template-columns:1.1fr .9fr; gap:0 clamp(36px,5vw,96px); align-items:center}
.intro,.actions {grid-column:2}
.intro {grid-row:1; align-self:end}
h1 {margin:0; font-size:clamp(52px,5.4vw,84px); line-height:1.12; letter-spacing:-.06em; font-weight:680}
.intro p {margin:22px 0 0; color:var(--muted); font-size:18px; max-width:22em}
.scope {grid-row:1/3; grid-column:1; aspect-ratio:1.08; background:radial-gradient(ellipse at center,#254138 0%,#192d26 58%,#15251f 90%); overflow:hidden; position:relative; display:grid; place-items:center; isolation:isolate; border:1px solid var(--line); border-radius:6px}
.scope:before {content:""; position:absolute; inset:0; background:radial-gradient(#72918455 .8px,transparent .9px) left top/14px 14px; opacity:.65}
.scope:after {content:""; position:absolute; width:82%; height:1px; top:50%; left:9%; background:linear-gradient(to right,#74948390,transparent 19%,transparent 81%,#74948390)}
.corner {position:absolute; width:17px; height:17px; border:solid #9db7a6; opacity:.85}
.tl {top:20px; left:20px; border-width:1px 0 0 1px}
.tr {top:20px; right:20px; border-width:1px 1px 0 0}
.bl {bottom:20px; left:20px; border-width:0 0 1px 1px}
.br {bottom:20px; right:20px; border-width:0 1px 1px 0}
.optic {width:68%; aspect-ratio:1; position:relative; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle,transparent 66%,#223a30 67%); border:1px solid #637b69; box-shadow:0 0 0 7px #20382c,0 0 0 8px #435b49}
.optic:before {content:""; position:absolute; inset:2.5%; border-radius:50%; background:repeating-conic-gradient(from 0deg,#acbca2 0deg .45deg,transparent .45deg 4deg); mask:radial-gradient(circle,#0000 66%,#000 66.4%)}
.iris {position:relative; width:81%; aspect-ratio:1; border-radius:50%; overflow:hidden; background:#0d1e18; outline:1px solid #84997c; outline-offset:3px}
.blade {position:absolute; inset:0; transform:rotate(calc(var(--i) * 60deg)); clip-path:polygon(0% 0%, 90% 0%, 57% 36%, 45% 36%, 28% 53%, 0% 77%); background:linear-gradient(124deg, #b3c99d -2%,#77977b 32%,#416856 66%,#294638 98%)}
.iris:after {content:""; position:absolute; inset:35%; background:#e6f8b6; clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); transform:rotate(-16deg)}
.datum {position:absolute; width:2px; height:6%; background:var(--accent); left:calc(50% - 1px); top:1%; z-index:1}
.actions {grid-row:2; align-self:start; margin-top:34px}
.primary,.upload-button {border:0; min-height:54px; border-radius:5px; font-weight:700; padding:12px 20px}
.primary {background:var(--accent); color:var(--ink); width:100%; display:flex; align-items:center; justify-content:center; gap:12px; font-size:18px}
.primary:hover {background:#efffc8}
.cam {display:inline-block; width:20px; height:15px; border:2px solid currentColor; border-radius:4px; position:relative}
.cam:before {content:""; position:absolute; top:-5px; left:3px; width:9px; height:4px; background:currentColor; border-radius:2px}
.cam:after {content:""; position:absolute; left:5px; top:2px; width:4px; height:4px; border-radius:50%; border:1.5px solid}
.enroll {border-top:1px solid var(--line); margin-top:28px; padding-top:12px; width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px}
.enroll span {color:var(--muted)}
.text-button {background:none; border:0; min-height:44px; padding:0 1px; font-weight:650; color:var(--accent)}
dialog {background:var(--surface); border:1px solid #587363; border-radius:12px; width:min(460px,calc(100% - 24px)); padding:24px; color:var(--text); max-height:90svh}
dialog::backdrop {background:#07130fbf}
dialog h2 {font-size:25px; margin:0; letter-spacing:-.025em}
.dialog-head {display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:20px}
dialog p {color:var(--muted)}
form {display:grid; gap:14px}
label {display:grid; gap:6px}
input:not([type=file]) {color:var(--text); padding:10px 12px; border:1px solid #73887b; border-radius:4px; width:100%; background:#14231d; min-height:46px}
.upload-button {background:transparent; border:1px solid #718677; font-size:16px; min-height:46px}
.uploads {display:flex; flex-wrap:wrap; gap:8px}
.preview {max-width:100%; max-height:160px; border-radius:4px; object-fit:contain; margin:auto}
.feedback {color:var(--accent); white-space:pre-wrap; margin:0}
[hidden],.feedback:empty {display:none!important}
@media(max-width:820px) {
 header,main {padding-left:26px; padding-right:26px}
 .station {gap:0 28px}
 h1 {font-size:50px}
}
@media(max-width:650px) {
 header,main {max-width:470px; padding-left:22px; padding-right:22px}
 .bar {height:68px}
 .brand {font-size:18px; gap:10px}
 .mark {width:24px; height:24px}
 .mark:after {inset:7px}
 main {padding-top:32px; padding-bottom:32px}
 .station {display:flex; flex-direction:column; align-items:stretch}
 h1 {font-size:44px; letter-spacing:-.05em}
 .intro p {font-size:16px; margin-top:10px; max-width:none}
 .scope {margin:22px 0 0; aspect-ratio:1.23}
 .optic {width:57%}
 .actions {align-self:stretch; margin-top:16px}
 .intro {align-self:stretch}
 .enroll {margin-top:22px; padding-top:9px}
}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><span class="mark" aria-hidden="true"></span>人脸签到</div><button class="login" data-open="login">登录</button></div></header>
<main>
  <section class="station" aria-labelledby="heading">
    <div class="intro"><h1 id="heading">现场打卡</h1><p>已录入标准照即可免登录打卡。<br>请正对镜头，拍一张清晰的单人照。</p></div>
    <div class="scope" aria-hidden="true">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="optic"><i class="datum"></i><div class="iris">
        <i class="blade" style="--i:0"></i><i class="blade" style="--i:1"></i><i class="blade" style="--i:2"></i>
        <i class="blade" style="--i:3"></i><i class="blade" style="--i:4"></i><i class="blade" style="--i:5"></i>
      </div></div>
    </div>
    <div class="actions"><button class="primary" id="shutter"><span class="cam" aria-hidden="true"></span>拍照打卡</button>
      <div class="enroll"><span>首次使用？</span><button class="text-button" data-open="register">注册并录入标准照</button></div>
    </div>
  </section>
</main>
<input id="onsite" type="file" accept="image/jpeg,image/png" capture="user" hidden>
<dialog id="panel" aria-labelledby="panel-title">
  <div class="dialog-head"><h2 id="panel-title"></h2><button id="dismiss" class="back">关闭</button></div>
  <form id="entry">
    <label id="name-row">姓名<input id="person-name" autocomplete="name" maxlength="64" required></label>
    <label id="number-row">学号<input id="student-no" inputmode="numeric" pattern="[0-9]{1,32}" maxlength="32" autocomplete="username" required></label>
    <label id="password-row">密码<input id="password" type="password" maxlength="64" required></label>
    <div id="standard-controls">
      <p>本人标准照 · 单人 JPEG 或 PNG，最多 5 MiB</p>
      <div class="uploads"><button type="button" class="upload-button" id="take">现场拍照</button><button type="button" class="upload-button" id="choose">从相册选择</button></div>
      <input id="portrait-camera" type="file" accept="image/jpeg,image/png" capture="user" hidden>
      <input id="portrait-library" type="file" accept="image/jpeg,image/png" hidden>
    </div>
    <img id="photo-preview" alt="所选照片预览" class="preview" hidden>
    <p class="feedback" id="feedback" role="status"></p>
    <button class="primary" id="preview-action" type="submit"></button>
  </form>
</dialog>
<script>
const byId = id => document.getElementById(id);
const dialog = byId('panel');
const form = byId('entry');
const preview = byId('photo-preview');
const feedback = byId('feedback');
const inputs = ['name','number','password'].map(key => byId(key+'-row'));
let mode, photo, photoUrl;
function clearPhoto() {
  if (photoUrl) URL.revokeObjectURL(photoUrl);
  photo = photoUrl = null;
  preview.hidden = true;
  preview.removeAttribute('src');
}
function openPanel(nextMode) {
  mode = nextMode;
  clearPhoto();
  form.reset();
  feedback.textContent = '';
  const register = mode === 'register';
  inputs.forEach((row,index) => {
    row.hidden = mode === 'capture' || (index === 0 && !register);
    row.querySelector('input').disabled = row.hidden;
  });
  byId('standard-controls').hidden = !register;
  byId('password').autocomplete = register ? 'new-password' : 'current-password';
  byId('password').minLength = register ? 8 : 1;
  const labels = {register:['注册并录入标准照','预览注册资料'],login:['学号登录','预览登录'],capture:['现场照片','重新拍摄']};
  [byId('panel-title').textContent,byId('preview-action').textContent] = labels[mode];
  dialog.showModal();
}
function setPhoto(file) {
  clearPhoto();
  if (!file) return;
  if (!['image/jpeg','image/png'].includes(file.type) || file.size > 5242880 || file.size === 0) {
    feedback.textContent = '请选择不超过 5 MiB 的 JPEG 或 PNG 照片。';
    return;
  }
  photo = file;
  preview.src = photoUrl = URL.createObjectURL(file);
  preview.hidden = false;
  feedback.textContent = mode === 'capture' ? '设计预览：照片仅在本机显示，未提交打卡。' : '';
}
for (const button of document.querySelectorAll('[data-open]')) button.onclick = () => openPanel(button.dataset.open);
byId('dismiss').onclick = () => dialog.close();
dialog.addEventListener('close', () => { clearPhoto(); form.reset(); byId('onsite').value = ''; });
function pick(id) {
  const input = byId(id);
  input.value = '';
  input.click();
}
byId('shutter').onclick = () => pick('onsite');
byId('onsite').onchange = event => {
  const file = event.target.files[0];
  if (!file) return;
  if (!dialog.open) openPanel('capture');
  setPhoto(file);
};
byId('take').onclick = () => pick('portrait-camera');
byId('choose').onclick = () => pick('portrait-library');
for (const id of ['portrait-camera','portrait-library']) byId(id).onchange = event => {if (event.target.files.length) setPhoto(event.target.files[0]);};
form.onsubmit = event => {
  event.preventDefault();
  if (mode === 'capture') return pick('onsite');
  if (mode === 'register' && !byId('person-name').value.trim()) {feedback.textContent='请填写姓名。'; return;}
  if (mode === 'register' && !photo) {feedback.textContent='请先选择本人的标准照。'; return;}
  feedback.textContent = mode === 'register' ? '设计预览：资料和照片未提交，未创建账号。' : '设计预览：未提交登录请求。';
};
</script>
</body>
</html>
